name: Windows and macOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    env:
      PYTHONUTF8: "1"
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Calculate theoretical resolution
        run: python resolution.py
      - name: Export uniform pupil figure
        run: python fourier_focus.py --no-show --grid-size 256 --padding-factor 4
      - name: Export Zernike figure
        run: python zernike_focus.py --no-show --grid-size 256 --padding-factor 4
